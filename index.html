<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="unsafe-url" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyPrivate" />
  <title>MYprivateCOLLECTION</title>
  <!-- PWA / Home Screen -->
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=20260724" />
</head>
<body>

  <!-- ═══ LOCK SCREEN ═══ -->
  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-card" id="lockCard">
      <div class="lock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="3"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="lock-title">MY<span>private</span>COLLECTION</h1>
      <p class="lock-sub">Privat &amp; geschützt · 18+</p>
      <form class="lock-form" id="lockForm" autocomplete="off">
        <input
          type="password"
          id="lockInput"
          class="lock-input"
          placeholder="Passwort eingeben"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Passwort"
        />
        <button type="submit" class="lock-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Entsperren
        </button>
      </form>
      <p class="lock-error" id="lockError" role="alert"></p>
    </div>
  </div>

  <!-- ═══ APP (hidden until unlock) ═══ -->
  <div class="app" id="app" hidden>

    <!-- Header -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="brand-btn" id="brandBtn" aria-label="Sammlung sperren">
          <svg class="brand-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2.5"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span class="brand-text">MY<em>private</em>COLLECTION</span>
        </button>

        <div class="topbar-right">
          <span class="count-chip" id="countChip"></span>

          <!-- Segmented control -->
          <div class="seg-ctrl" role="group" aria-label="Anzeigemodus">
            <button class="seg-btn active" id="gridBtn" aria-pressed="true" aria-label="Rasteransicht">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              </svg>
              <span>Grid</span>
            </button>
            <button class="seg-btn" id="swipeBtn" aria-pressed="false" aria-label="TikTok-Modus">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="2" width="14" height="20" rx="2"/>
                <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5"/>
              </svg>
              <span>Swipe</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ── GRID VIEW ── -->
    <div class="view" id="gridView">

      <!-- Search -->
      <div class="search-area">
        <div class="search-pill">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Sammlung durchsuchen…"
            autocomplete="off"
            enterkeyhint="search"
            aria-label="Videos suchen"
          />
          <button id="clearBtn" class="search-clear" aria-label="Suche löschen" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Sort control -->
        <div class="sort-row" role="group" aria-label="Sortierung">
          <button class="sort-btn active" id="sortAscBtn" data-sort="asc" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
            <span>1 → N</span>
          </button>
          <button class="sort-btn" id="sortDescBtn" data-sort="desc" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <polyline points="19 12 12 19 5 12"/>
            </svg>
            <span>N → 1</span>
          </button>
          <button class="sort-btn" id="sortRandomBtn" data-sort="random" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"/>
              <line x1="4" y1="20" x2="21" y2="3"/>
              <polyline points="21 16 21 21 16 21"/>
              <line x1="15" y1="15" x2="21" y2="21"/>
              <line x1="4" y1="4" x2="9" y2="9"/>
            </svg>
            <span>Zufällig</span>
          </button>
        </div>
      </div>

      <p class="grid-status" id="gridStatus"></p>

      <div class="card-grid" id="cardGrid"></div>

      <nav class="page-nav" id="pageNav" aria-label="Seitennavigation"></nav>
    </div>

    <!-- ── SWIPE / TIKTOK VIEW ── -->
    <div class="swipe-view" id="swipeView" hidden aria-hidden="true">

      <!-- Counter + Close button -->
      <div class="swipe-hud">
        <span class="swipe-counter" id="swipeCounter">1 / 0</span>
        <button class="swipe-close" id="swipeClose" aria-label="Zurück zur Rasteransicht">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Scroll container (snaps vertically) -->
      <div class="swipe-track" id="swipeTrack" role="feed" aria-label="Videos"></div>

      <!-- First-time hint -->
      <div class="swipe-hint" id="swipeHint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
        <span>Wischen zum nächsten Video</span>
      </div>
    </div>

  </div><!-- /app -->

  <!-- ═══ PRIVACY ACTION SHEET ═══ -->
  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true"></div>
  <div class="action-sheet" id="actionSheet" role="dialog" aria-modal="true"
       aria-label="Video öffnen" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <p class="sheet-title" id="sheetTitle"></p>

    <div class="sheet-actions">
      <!-- Open directly (normal) -->
      <a class="sheet-btn sheet-btn--primary" id="sheetOpen" target="_blank"
         rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        In Safari öffnen
      </a>

      <!-- Copy link (paste in private tab) -->
      <button class="sheet-btn" id="sheetCopy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Link kopieren → Privat einfügen
      </button>

      <!-- Firefox private -->
      <a class="sheet-btn" id="sheetFirefox"
         rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4l3 3"/>
        </svg>
        In Firefox Privat öffnen
      </a>
    </div>

    <button class="sheet-cancel" id="sheetCancel">Abbrechen</button>
  </div>

  <!-- Copy-toast -->
  <div class="copy-toast" id="copyToast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    Link kopiert — in privatem Tab einfügen
  </div>

  <script src="script_cleaned.js?v=20260617"></script>
  <script src="app.js?v=20260724"></script>
</body>
</html>
